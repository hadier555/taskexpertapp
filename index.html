<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="clckd" content="c124c5939d8a569ff3823b803fba763f" />
    <title>🎬 VAST 3.0 Ad Player – No CORS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body,
        html {
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #main {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #0a0a0f;
        }
        #ad-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #ad-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* ----- DEBUG PANEL ----- */
        #debug-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.88);
            color: #0f0;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 50;
            border: 1px solid #333;
            backdrop-filter: blur(4px);
            display: none;
            pointer-events: none;
            scroll-behavior: smooth;
        }
        #debug-panel .log-line {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        #debug-panel .log-error {
            color: #f87171;
        }
        #debug-panel .log-success {
            color: #34d399;
        }
        #debug-panel .log-info {
            color: #60a5fa;
        }
        #debug-panel .log-warn {
            color: #fbbf24;
        }
        #debug-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 55;
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 11px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
        }
        #debug-toggle:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* ----- PLAY BUTTON ----- */
        #play-btn {
            position: absolute;
            padding: 20px 56px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            color: #fff;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(236, 72, 153, 0.5);
            z-index: 20;
            transition: 0.3s;
            text-transform: uppercase;
        }
        #play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(236, 72, 153, 0.7);
        }
        #play-btn:active {
            transform: scale(0.95);
        }

        /* ----- LOADING ----- */
        #loading {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            color: #fff;
            gap: 16px;
        }
        #loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ec4899;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loading span {
            font-size: 16px;
            font-weight: 300;
            color: #94a3b8;
        }

        /* ----- ERROR ----- */
        #error-msg {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: #fbbf24;
            background: rgba(0, 0, 0, 0.85);
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            display: none;
            z-index: 30;
            border: 1px solid rgba(251, 191, 36, 0.3);
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(4px);
        }
        #retry-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 44px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            z-index: 25;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
            transition: 0.3s;
        }
        #retry-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(236, 72, 153, 0.7);
        }

        /* ----- TOP CONTROLS ----- */
        .top-controls {
            position: absolute;
            top: 24px;
            right: 24px;
            display: none;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 18px;
            border-radius: 50px;
            z-index: 15;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .top-controls * {
            pointer-events: auto;
        }
        .top-controls .ad-countdown {
            color: #e2e8f0;
            font-weight: 500;
            font-size: 15px;
            min-width: 70px;
            text-align: center;
        }
        .top-controls .ad-skip-btn {
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .top-controls .ad-skip-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .top-controls .ad-skip-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            border-color: #fff;
        }
        .top-controls .sound-btn {
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
            min-width: 40px;
            text-align: center;
            line-height: 1;
        }
        .top-controls .sound-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .top-controls .btn-download-small {
            padding: 6px 16px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
            box-shadow: 0 2px 12px rgba(34, 197, 94, 0.3);
        }
        .top-controls .btn-download-small:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 18px rgba(34, 197, 94, 0.4);
        }

        /* ----- BOTTOM BAR ----- */
        #bottom-bar {
            height: 80px;
            min-height: 80px;
            background: #111118;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }
        .btn-download-big {
            padding: 14px 48px;
            border-radius: 50px;
            border: none;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 6px 24px rgba(34, 197, 94, 0.35);
            transition: 0.25s ease;
            letter-spacing: 0.5px;
        }
        .btn-download-big:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 32px rgba(34, 197, 94, 0.5);
            background: linear-gradient(135deg, #2dd55e, #15803d);
        }
        .btn-download-big:active {
            transform: scale(0.95);
        }

        /* ----- TRACKING BADGE ----- */
        #tracking-badge {
            position: absolute;
            bottom: 80px;
            left: 20px;
            color: #22c55e;
            font-size: 13px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.75);
            padding: 5px 14px;
            border-radius: 30px;
            z-index: 15;
            display: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            align-items: center;
            gap: 6px;
        }
        #tracking-badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        @media (max-width: 600px) {
            #play-btn {
                padding: 16px 36px;
                font-size: 22px;
            }
            .btn-download-big {
                padding: 12px 32px;
                font-size: 16px;
            }
            #bottom-bar {
                height: 74px;
                min-height: 74px;
            }
            .top-controls {
                top: 12px;
                right: 12px;
                padding: 8px 14px;
                gap: 8px;
            }
            .top-controls .ad-countdown {
                font-size: 13px;
                min-width: 55px;
            }
            .top-controls .ad-skip-btn {
                font-size: 13px;
                padding: 5px 14px;
            }
            .top-controls .btn-download-small {
                font-size: 12px;
                padding: 5px 12px;
            }
            .top-controls .sound-btn {
                font-size: 17px;
                padding: 5px 8px;
                min-width: 34px;
            }
            #error-msg {
                font-size: 13px;
                padding: 10px 18px;
                bottom: 100px;
            }
            #retry-btn {
                padding: 12px 32px;
                font-size: 17px;
            }
            #tracking-badge {
                bottom: 70px;
                left: 12px;
                font-size: 11px;
                padding: 4px 12px;
            }
            #debug-panel {
                font-size: 10px;
                max-height: 120px;
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="ad-container">
            <video id="ad-video" playsinline></video>
            <div id="loading">
                <div class="spinner"></div>
                <span>Loading ad...</span>
            </div>
            <button id="play-btn">▶ Play Ad</button>
            <button id="retry-btn">🔄 Retry</button>
            <div id="error-msg"></div>

            <!-- Top Controls -->
            <div class="top-controls" id="top-controls">
                <span class="ad-countdown" id="ad-countdown">Ad · 0s</span>
                <button class="ad-skip-btn" id="ad-skip-btn" disabled>Skip ⏳</button>
                <button class="sound-btn" id="sound-btn">🔊</button>
                <a href="#" id="download-small" class="btn-download-small" target="_blank">⬇️ Download</a>
            </div>

            <!-- Tracking Badge -->
            <div id="tracking-badge"><span class="dot"></span> Tracking Active</div>

            <!-- Debug Panel -->
            <div id="debug-panel"></div>
            <button id="debug-toggle">🐞 Show Debug</button>
        </div>

        <!-- Bottom Bar -->
        <div id="bottom-bar">
            <a href="#" id="download-big" class="btn-download-big" target="_blank">⬇️ Download</a>
        </div>
    </div>

    <script>
        /**
         * ================================================================
         * 🔑 HILLTOPADS CREDENTIALS – REPLACE WITH YOUR ACTUAL VALUES
         * ================================================================
         */
        // 👇 REPLACE THESE WITH YOUR ACTUAL VALUES
        const API_KEY = 'X1aAiDm6f90fSIRhO4KKPpokMkWAXenGiAME1kmwBguVfVvTdtMHO3wWWL4puddV';
        const ZONE_ID = '7253257';
        // ================================================================

        // ===== API Proxy endpoint (Cloudflare Pages Function) =====
        const PROXY_URL = '/api?api_key=' + API_KEY + '&zone_id=' + ZONE_ID;
        const DEFAULT_CTA = 'https://google.com';
        const SKIP_DELAY = 15;

        // ===== DOM refs =====
        const video = document.getElementById('ad-video');
        const main = document.getElementById('main');
        const playBtn = document.getElementById('play-btn');
        const retryBtn = document.getElementById('retry-btn');
        const errorMsg = document.getElementById('error-msg');
        const loading = document.getElementById('loading');
        const topControls = document.getElementById('top-controls');
        const countdown = document.getElementById('ad-countdown');
        const skipBtn = document.getElementById('ad-skip-btn');
        const soundBtn = document.getElementById('sound-btn');
        const downloadSmall = document.getElementById('download-small');
        const downloadBig = document.getElementById('download-big');
        const trackingBadge = document.getElementById('tracking-badge');
        const debugPanel = document.getElementById('debug-panel');
        const debugToggle = document.getElementById('debug-toggle');

        // ===== State =====
        let isAdPlaying = false;
        let skipInterval = null;
        let currentClickUrl = '';
        let isMuted = false;
        let impressionUrls = [];
        let impressionsFired = false;

        // ===== DEBUG LOGGING =====
        let debugVisible = false;

        function logToScreen(msg, type) {
            type = type || 'info';
            const div = document.createElement('div');
            div.className = 'log-line log-' + type;
            div.textContent = '> ' + msg;
            debugPanel.appendChild(div);
            debugPanel.scrollTop = debugPanel.scrollHeight;
            if (!debugVisible) {
                debugPanel.style.display = 'block';
                debugToggle.textContent = '🐞 Hide Debug';
                debugVisible = true;
            }
            console.log('[VAST]', msg);
        }

        debugToggle.addEventListener('click', function() {
            if (debugVisible) {
                debugPanel.style.display = 'none';
                debugToggle.textContent = '🐞 Show Debug';
                debugVisible = false;
            } else {
                debugPanel.style.display = 'block';
                debugToggle.textContent = '🐞 Hide Debug';
                debugVisible = true;
            }
        });

        // ===== VIDEO & AUDIO =====
        video.muted = false;
        soundBtn.textContent = '🔊';

        function showError(msg, showRetry) {
            showRetry = showRetry || false;
            errorMsg.style.display = 'block';
            errorMsg.textContent = '⚠️ ' + msg;
            retryBtn.style.display = showRetry ? 'block' : 'none';
            logToScreen('ERROR: ' + msg, 'error');
        }

        function hideError() {
            errorMsg.style.display = 'none';
            retryBtn.style.display = 'none';
        }

        function showLoading(show) {
            loading.style.display = show ? 'flex' : 'none';
        }

        function showControls(show) {
            topControls.style.display = show ? 'flex' : 'none';
        }

        function toggleSound() {
            video.muted = !video.muted;
            isMuted = video.muted;
            soundBtn.textContent = isMuted ? '🔇' : '🔊';
        }
        soundBtn.addEventListener('click', toggleSound);

        // ===== 🔥 IMPRESSION FIRE =====
        function fireImpressions() {
            if (impressionsFired) return;
            impressionsFired = true;

            logToScreen('🔥 FIRING ' + impressionUrls.length + ' IMPRESSION(S)', 'success');
            trackingBadge.style.display = 'flex';

            impressionUrls.forEach(function(url, index) {
                if (url) {
                    var finalUrl = url;
                    if (finalUrl.indexOf('?') === -1) {
                        finalUrl += '?';
                    } else {
                        finalUrl += '&';
                    }
                    finalUrl += 'cachebuster=' + Date.now() +
                        '&ref=' + encodeURIComponent(window.location.href);

                    logToScreen('  ➜ URL ' + (index + 1) + ': ' + finalUrl.substring(0, 80) + '...', 'info');

                    var img = new Image();
                    img.src = finalUrl;

                    if (navigator.sendBeacon) {
                        navigator.sendBeacon(finalUrl);
                    }
                }
            });
            logToScreen('✅ Impression requests sent! Dashboard updates in 10-15 min.', 'success');
        }

        // ===== RESET =====
        function resetPlayer() {
            isAdPlaying = false;
            impressionsFired = false;
            impressionUrls = [];
            clearInterval(skipInterval);
            video.pause();
            video.removeAttribute('src');
            video.load();
            showControls(false);
            skipBtn.disabled = true;
            skipBtn.textContent = 'Skip ⏳';
            countdown.textContent = 'Ad · 0s';
            playBtn.style.display = 'block';
            playBtn.textContent = '▶ Play Ad';
            hideError();
            showLoading(false);
            downloadSmall.style.display = 'none';
            downloadBig.style.display = 'none';
            trackingBadge.style.display = 'none';
            video.muted = false;
            isMuted = false;
            soundBtn.textContent = '🔊';
            video.onplay = null;
            video.onerror = null;
            video.ontimeupdate = null;
            if (debugPanel.children.length > 30) {
                while (debugPanel.children.length > 20) {
                    debugPanel.removeChild(debugPanel.firstChild);
                }
            }
        }

        // ===== PARSE VAST XML =====
        function parseVASTAndPlay(xmlString) {
            logToScreen('📄 Parsing VAST XML...', 'info');
            try {
                var parser = new DOMParser();
                var xml = parser.parseFromString(xmlString, 'text/xml');
                if (xml.querySelector('parsererror')) {
                    showError('Invalid XML response', true);
                    showLoading(false);
                    playBtn.style.display = 'block';
                    logToScreen('❌ XML parse error', 'error');
                    return;
                }
                logToScreen('✅ VAST XML parsed successfully', 'success');

                // ---- 1. Get Video URL ----
                var mediaFiles = xml.querySelectorAll('MediaFile');
                var videoUrl = null;
                for (var i = 0; i < mediaFiles.length; i++) {
                    var node = mediaFiles[i];
                    var type = node.getAttribute('type') || '';
                    var url = node.textContent.trim();
                    if (!url) {
                        url = node.getAttribute('src') || node.getAttribute('url') || '';
                    }
                    if (url && (type.indexOf('mp4') !== -1 || type.indexOf('video/mp4') !== -1)) {
                        videoUrl = url;
                        break;
                    }
                }
                if (!videoUrl) {
                    for (var j = 0; j < mediaFiles.length; j++) {
                        var n = mediaFiles[j];
                        var t = n.getAttribute('type') || '';
                        var u = n.textContent.trim();
                        if (!u) {
                            u = n.getAttribute('src') || n.getAttribute('url') || '';
                        }
                        if (u && t.indexOf('video') !== -1) {
                            videoUrl = u;
                            break;
                        }
                    }
                }
                if (!videoUrl) {
                    showError('No MP4 video found in VAST', true);
                    showLoading(false);
                    playBtn.style.display = 'block';
                    logToScreen('❌ No video URL in VAST', 'error');
                    return;
                }
                logToScreen('✅ Video URL found: ' + videoUrl.substring(0, 60) + '...', 'success');

                // ---- 2. Get ClickThrough ----
                currentClickUrl = '';
                var clickNode = xml.querySelector('ClickThrough');
                if (clickNode) {
                    currentClickUrl = clickNode.textContent.trim();
                }
                logToScreen('✅ ClickThrough URL found: ' + (currentClickUrl ? 'Yes' : 'No'), 'info');

                // ---- 3. Get Impression URLs ----
                impressionUrls = [];
                var impNodes = xml.querySelectorAll('Impression');
                for (var k = 0; k < impNodes.length; k++) {
                    var u2 = impNodes[k].textContent.trim();
                    if (u2) {
                        impressionUrls.push(u2);
                    }
                }
                var inlineImp = xml.querySelector('InLine Impression');
                if (inlineImp) {
                    var u3 = inlineImp.textContent.trim();
                    if (u3 && impressionUrls.indexOf(u3) === -1) {
                        impressionUrls.push(u3);
                    }
                }
                logToScreen('✅ Found ' + impressionUrls.length + ' Impression URL(s)', 'success');
                if (impressionUrls.length > 0) {
                    logToScreen('  ➜ ' + impressionUrls[0].substring(0, 80) + '...', 'info');
                }

                impressionsFired = false;
                showLoading(false);

                // ---- Load video ----
                video.src = videoUrl;
                video.muted = false;
                isMuted = false;
                soundBtn.textContent = '🔊';

                video.load();
                var playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(function() {
                            logToScreen('▶ Video playing', 'success');
                            isAdPlaying = true;
                            showControls(true);
                            startSkipTimer();

                            var impressionTimeout = setTimeout(function() {
                                fireImpressions();
                            }, 1000);

                            video.ontimeupdate = function() {
                                if (video.currentTime >= 1 && !impressionsFired) {
                                    clearTimeout(impressionTimeout);
                                    fireImpressions();
                                    video.ontimeupdate = null;
                                }
                            };
                        })
                        .catch(function(err) {
                            logToScreen('❌ Play error: ' + err.message, 'error');
                            showError('Tap to play video', true);
                            showLoading(false);
                            playBtn.style.display = 'block';
                            playBtn.textContent = '▶ Tap to Play';
                            playBtn.onclick = function() {
                                video.play().catch(function() {});
                                playBtn.style.display = 'none';
                                showLoading(true);
                            };
                        });
                }

                video.onended = function() {
                    logToScreen('⏹ Video ended', 'info');
                    finishAd();
                };

                video.onerror = function() {
                    var errMsg = video.error ? video.error.message : 'unknown';
                    logToScreen('❌ Video error: ' + errMsg, 'error');
                    showError('Video error. Retry?', true);
                    showLoading(false);
                    playBtn.style.display = 'block';
                };

                var link = currentClickUrl || DEFAULT_CTA;
                downloadSmall.href = link;
                downloadSmall.style.display = 'inline-flex';
                downloadBig.href = link;
                downloadBig.style.display = 'inline-flex';

                playBtn.style.display = 'none';

                if (!document.fullscreenElement) {
                    main.requestFullscreen().catch(function() {});
                }

            } catch (e) {
                logToScreen('❌ Exception: ' + e.message, 'error');
                showError('Parse error: ' + e.message, true);
                showLoading(false);
                playBtn.style.display = 'block';
            }
        }

        // ===== FETCH VAST URL FROM PROXY =====
        function fetchVastFromAPI() {
            logToScreen('🌐 Fetching VAST URL from proxy...', 'info');
            logToScreen('  ➜ ' + PROXY_URL.substring(0, 80) + '...', 'info');

            return fetch(PROXY_URL, { mode: 'cors' })
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function(text) {
                    logToScreen('✅ Proxy response (' + text.length + ' chars)', 'success');

                    try {
                        var json = JSON.parse(text);
                        if (json && json.vast_url) {
                            logToScreen('✅ vast_url from JSON: ' + json.vast_url.substring(0, 60) + '...', 'success');
                            return json.vast_url;
                        }
                        if (text.trim().startsWith('http')) {
                            logToScreen('✅ Proxy returned raw URL', 'success');
                            return text.trim();
                        }
                        if (text.trim().startsWith('<')) {
                            logToScreen('📄 Proxy returned XML directly, parsing...', 'info');
                            parseVASTAndPlay(text);
                            return null;
                        }
                        throw new Error('Unknown response format');
                    } catch (e) {
                        if (text.trim().startsWith('http')) {
                            logToScreen('✅ Proxy returned raw URL (non-JSON)', 'success');
                            return text.trim();
                        }
                        if (text.trim().startsWith('<')) {
                            logToScreen('📄 Proxy returned XML directly (non-JSON)', 'info');
                            parseVASTAndPlay(text);
                            return null;
                        }
                        throw new Error('Invalid response: ' + text.substring(0, 100));
                    }
                });
        }

        // ===== FETCH VAST XML FROM URL =====
        function fetchVastXML(vastUrl) {
            logToScreen('🌐 Fetching VAST XML from URL...', 'info');
            logToScreen('  ➜ ' + vastUrl.substring(0, 80) + '...', 'info');

            return fetch(vastUrl, { mode: 'cors' })
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function(xml) {
                    logToScreen('✅ VAST XML fetched (' + xml.length + ' chars)', 'success');
                    return xml;
                });
        }

        // ===== MAIN FLOW =====
        function fetchAndPlay() {
            resetPlayer();
            hideError();
            showLoading(true);
            playBtn.style.display = 'none';
            playBtn.onclick = null;

            fetchVastFromAPI()
                .then(function(result) {
                    if (result === null) return;
                    if (typeof result === 'string' && result.startsWith('http')) {
                        return fetchVastXML(result);
                    }
                    throw new Error('Invalid vast_url: ' + result);
                })
                .then(function(xml) {
                    if (xml) {
                        parseVASTAndPlay(xml);
                    }
                })
                .catch(function(err) {
                    logToScreen('❌ Error: ' + err.message, 'error');
                    showError('Failed to load ad: ' + err.message, true);
                    showLoading(false);
                    playBtn.style.display = 'block';
                });
        }

        // ===== SKIP TIMER =====
        function startSkipTimer() {
            var rem = SKIP_DELAY;
            skipBtn.disabled = true;
            skipBtn.textContent = 'Skip ⏳ ' + rem + 's';
            countdown.textContent = 'Ad · ' + rem + 's';
            skipInterval = setInterval(function() {
                rem--;
                if (rem <= 0) {
                    clearInterval(skipInterval);
                    skipBtn.disabled = false;
                    skipBtn.textContent = 'Skip ▶';
                    countdown.textContent = 'Skip now';
                } else {
                    skipBtn.textContent = 'Skip ⏳ ' + rem + 's';
                    countdown.textContent = 'Ad · ' + rem + 's';
                }
            }, 1000);
        }

        function finishAd() {
            clearInterval(skipInterval);
            resetPlayer();
            playBtn.style.display = 'block';
            playBtn.textContent = '▶ Play Again';
            logToScreen('✅ Ad finished. Play again?', 'info');
        }

        // ===== EVENT LISTENERS =====
        skipBtn.addEventListener('click', function() {
            if (skipBtn.disabled) return;
            finishAd();
        });

        playBtn.addEventListener('click', fetchAndPlay);
        retryBtn.addEventListener('click', fetchAndPlay);

        // ===== INIT =====
        resetPlayer();
        logToScreen('🚀 VAST 3.0 Player ready! (CORS fixed via proxy)', 'success');
        logToScreen('📌 API proxy: /api', 'info');
        logToScreen('🔑 API_KEY: ' + API_KEY.substring(0, 10) + '...', 'info');
        logToScreen('📌 ZONE_ID: ' + ZONE_ID, 'info');

        if (API_KEY === 'YOUR_API_KEY_HERE' || ZONE_ID === 'YOUR_ZONE_ID_HERE') {
            logToScreen('⚠️ WARNING: Replace API_KEY and ZONE_ID in the code!', 'warn');
        }
    </script>
</body>
</html>
